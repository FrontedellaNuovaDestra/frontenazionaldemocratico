<!DOCTYPE html>

    <!-- Google Fonts: Outfit per un design geometrico e moderno -->

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BARRA DI NAVIGAZIONE BLINDATA -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo-link">
                <img src="61566.png" alt="Logo Fronte Nazional Democratico" class="logo-img">

        <div class="wave-background">
            <div class="wave wave1"></div>
            <div class="wave wave2"></div>
            <div class="wave wave3"></div>
        </div>

            <a href="https://www.instagram.com/fronte.nazional.democratico" target="_blank" rel="noopener noreferrer" class="social-link">

                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
