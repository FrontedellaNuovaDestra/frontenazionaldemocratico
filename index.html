<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FND | Fronte Nazional Democratico - Sito Ufficiale</title>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SCENOGRAFIA DI SFONDO: STATUA DELLA LIBERTA' -->
    <div class="statue-background-wrapper">
        <img src="statua-bg.png" alt="Statua della Libertà" class="statue-bg-img">
        <div class="background-overlay"></div>
    </div>

    <!-- NAVBAR FISSA ISTITUZIONALE -->
    <header class="navbar" role="banner">
        <div class="nav-container">
            <a href="index.html" class="logo-box" aria-label="Home FND">
                <img src="logo.png" alt="Logo Ufficiale FND" class="logo-img">
            </a>
            <nav class="nav-menu" role="navigation">
                <a href="index.html" class="nav-link active">HOME</a>
                <a href="#programma" class="nav-link">PROGRAMMA</a>
                <a href="#chisiamo" class="nav-link">CHI SIAMO</a>
                <a href="#shop" class="nav-link">SHOP</a>
            </nav>
        </div>
    </header>

    <!-- SEZIONE HERO CENTRALE -->
    <main class="hero-section" role="main">
        <div class="glass-card">
            
            <!-- Stemma / Icona Centrale -->
            <div class="card-emblem">
                <img src="statua-icon.png" alt="Emblema FND" class="emblem-img">
            </div>

            <!-- Contenuti Principali -->
            <h1 class="main-title">PROGRAMMA 2026/27</h1>
            <p class="main-slogan">Stufo di politiche bloccate nel passato? Scegli il futuro, scegli FND.</p>

            <!-- Bottone Call to Action (CTA) Blindato -->
            <div class="cta-container">
                <a href="#programma" class="btn-primary">
                    <span class="btn-text">INIZIA A CAMBIARE IL TUO FUTURO!</span>
                    <span class="btn-subtext">CLICCA QUI PER ACCEDERE AL PROGRAMMA UFFICIALE</span>
                </a>
            </div>

        </div>
    </main>

    <!-- FOOTER ISTITUZIONALE -->
    <footer class="footer">
        <p>&copy; 2026 Fronte Nazional Democratico. Tutti i diritti riservati.</p>
    </footer>

</body>
</html>
